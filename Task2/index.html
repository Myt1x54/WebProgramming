<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archery Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="gameContainer">
        <div id="topBar">
            <div class="info">Score: <span id="score">0</span></div>
            <div class="info">Time: <span id="timer">60</span>s</div>
            <div class="info">Arrows: <span id="arrowCount">15</span></div>
        </div>

        <div id="gameArea">
            <div id="bow">🏹</div>
            <div id="arrow"></div>
            <div id="target"></div>
        </div>

        <button id="shootBtn">SHOOT ARROW</button>
        <button id="restartBtn" style="display: none;">RESTART GAME</button>

        <div id="gameOverMsg" style="display: none;">
            <h2>GAME OVER!</h2>
            <p>Your Score: <span id="finalScore">0</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
