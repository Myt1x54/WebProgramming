<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AI Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background: #48bb78;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        #welcomeMessage {
            font-size: 20px;
            color: #555;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .info {
            background: #f7fafc;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            font-size: 14px;
            color: #666;
        }
        .btn {
            padding: 15px 40px;
            background: #e53e3e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #c53030;
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">🤖 AI Version</span>
        <h1>📊 Dashboard</h1>
        <div id="welcomeMessage">Loading...</div>
        <div id="loginInfo" class="info" style="display:none;"></div>
        <button class="btn" onclick="logout()">Logout</button>
        <div id="message" class="message"></div>
    </div>

    <script>
        // Check if user is logged in
        window.onload = async () => {
            try {
                const response = await fetch('/dashboard');
                const data = await response.json();
                
                if (response.ok && data.success) {
                    document.getElementById('welcomeMessage').textContent = data.message;
                    
                    // Show additional info
                    if (data.loginTime) {
                        const loginInfo = document.getElementById('loginInfo');
                        loginInfo.style.display = 'block';
                        loginInfo.innerHTML = `
                            <strong>User:</strong> ${data.user}<br>
                            <strong>Login Time:</strong> ${new Date(data.loginTime).toLocaleString()}<br>
                            <strong>Session:</strong> Active ✅
                        `;
                    }
                } else {
                    document.getElementById('welcomeMessage').textContent = 'Please login first';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                }
            } catch (error) {
                document.getElementById('message').style.display = 'block';
                document.getElementById('message').className = 'message error';
                document.getElementById('message').textContent = 'Error: ' + error.message;
            }
        };

        async function logout() {
            try {
                const response = await fetch('/logout');
                const data = await response.json();
                
                if (response.ok) {
                    alert(data.message);
                    window.location.href = 'index.html';
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
