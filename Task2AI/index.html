<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archery Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="topUI">
        <div id="settingsIcon">⚙️</div>
        <div id="scoreDisplay"><span id="score">0</span></div>
        <div id="arrowsDisplay">
            <span class="arrowIcon">🏹</span>
            <span class="arrowIcon">🏹</span>
            <span class="arrowIcon">🏹</span>
            <span id="arrowCount">11</span>
        </div>
        <div id="userIcon">G</div>
    </div>


    <div id="gameArea">

        <div id="sky">
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            <div class="cloud cloud3"></div>
        </div>

        <div id="bowContainer">
            <div id="bow"></div>
            <div id="bowArrow"></div>
            <svg id="bowstring" width="60" height="160" style="position: absolute; left: 0px; top: 0px; pointer-events: none; z-index: 52;">
                <line id="stringLine" x1="5" y1="10" x2="5" y2="145" stroke="#333" stroke-width="2"/>
            </svg>
            <div id="arrow"></div>
        </div>
        
        <div id="target">
            <div class="ring ring1"></div>
            <div class="ring ring2"></div>
            <div class="ring ring3"></div>
            <div class="ring ring4"></div>
        </div>

        <div id="landscape">
            <div class="tree tree1">🌳</div>
            <div class="tree tree2">🌳</div>
            <div id="ground"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
